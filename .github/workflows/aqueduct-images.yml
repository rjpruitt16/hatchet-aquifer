# hatchet-aquifer: build the patched Hatchet images used by
# github.com/rjpruitt16/aqueduct-benchmarks. Runs only on aqueduct/*
# branches, so the upstream workflows and releases are untouched.
name: aqueduct images

on:
  push:
    branches: ["aqueduct/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Aqueduct patch tests
        run: go test ./api/v1/server/handlers/v1/workflow-runs/ -run ResourceExhausted -v

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        id: tag
        run: |
          branch="${GITHUB_REF_NAME#aqueduct/}"
          echo "tag=${branch}-aqueduct-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/package/servers.dockerfile
          platforms: linux/amd64
          build-args: |
            SERVER_TARGET=${{ matrix.target }}
            VERSION=${{ steps.tag.outputs.tag }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hatchet-aquifer-${{ matrix.target }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
